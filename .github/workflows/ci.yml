name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push makes the older run's verdict worthless, so it cancels that run rather than racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Dependabot PRs are never merged (the bump is applied by hand on main, where this runs), so CI on them is spent minutes.
    if: github.actor != 'dependabot[bot]'
    # The same `gate` a contributor runs. A check that exists only in this file does not run locally.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      # The runner's apt shellcheck lags (0.9.0 on Ubuntu 24.04), so CI pins the release developers run.
      # actionlint is not on the image; gate's workflows check uses it from PATH.
      # Downloads retry transient failures instead of failing the run on a GitHub 5xx or a dropped connection.
      - name: Install gate tools
        run: |
          curl -fsSL --retry 18 --retry-delay 10 -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" "$RUNNER_TEMP/bin/shellcheck"
          curl -fsSL --retry 18 --retry-delay 10 -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          # @latest would let the gate binary change under the same workflow SHA.
          go install github.com/Rethunk-Tech/rethunk-gate-cli/cmd/gate@v0.6.9
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: gate
      - name: Keep the build for the release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: overlay
          path: src/StreamOverlay/bin/Release/net6.0
          if-no-files-found: error

  # Only a v* tag publishes, so only this job can write to the repository. Mortar installs the zip from this release.
  release:
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: overlay
          path: out
      - name: Package
        run: |
          version="$(jq -r .Version out/manifest.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match csproj Version $version" >&2
            exit 1
          fi
          mkdir -p dist/MortarStreamOverlay
          cp out/StreamOverlay.dll out/manifest.json dist/MortarStreamOverlay/
          (cd dist && zip -r "MortarStreamOverlay-$version.zip" MortarStreamOverlay && sha256sum "MortarStreamOverlay-$version.zip" > "MortarStreamOverlay-$version.zip.sha256")
          echo "version=$version" >>"$GITHUB_ENV"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            "dist/MortarStreamOverlay-$version.zip" "dist/MortarStreamOverlay-$version.zip.sha256"
